<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Disposisi Arsip Masuk</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f0f4f8; padding: 20px;">
    <div style="max-width: 600px; background: #ffffff; padding: 30px; border-radius: 10px;">
        <h2 style="color: #0f4c75;">{{APP_NAME}}</h2>
        <p>Halo, <strong>{{USER_NAME}}</strong></p>
        <p>Anda menerima disposisi dokumen baru yang berlu diarsipkan dari <strong>{{FROM_NAME}}</strong>:</p>
        <ul style="background: #f9fafb; padding: 15px; border-radius: 5px;">
            <li><strong>No. Dokumen:</strong> {{DOC_NUMBER}}</li>
            <li><strong>Judul:</strong> {{DOC_TITLE}}</li>
            <li><strong>Prioritas:</strong> {{PRIORITY}}</li>
            <li><strong>Catatan:</strong> {{NOTES}}</li>
        </ul>
        <p style="margin-top: 20px;">
            <a href="{{APP_URL}}/disposition_view.php?id={{DISP_ID}}" style="background: #0d9488; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px;">Lihat Disposisi</a>
        </p>
        <p style="font-size: 12px; color: #6b7280; margin-top: 30px;">Email ini dikirim otomatis oleh sistem {{COMPANY_NAME}}.</p>
    </div>
</body>
</html>
